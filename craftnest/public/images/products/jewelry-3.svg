<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f5f2eb"/>
  <!-- Earring 1 Left -->
  <g transform="translate(120, 70)">
    <circle cx="40" cy="40" r="16" fill="#8d99ae"/>
    <polygon points="40,60 15,110 65,110" fill="#8d99ae"/>
    <circle cx="40" cy="85" r="8" fill="#fff"/>
    <!-- Hanging pearls -->
    <circle cx="20" cy="120" r="5" fill="#edf2f4"/>
    <circle cx="40" cy="125" r="5" fill="#edf2f4"/>
    <circle cx="60" cy="120" r="5" fill="#edf2f4"/>
  </g>
  <!-- Earring 2 Right -->
  <g transform="translate(200, 70)">
    <circle cx="40" cy="40" r="16" fill="#8d99ae"/>
    <polygon points="40,60 15,110 65,110" fill="#8d99ae"/>
    <circle cx="40" cy="85" r="8" fill="#fff"/>
    <!-- Hanging pearls -->
    <circle cx="20" cy="120" r="5" fill="#edf2f4"/>
    <circle cx="40" cy="125" r="5" fill="#edf2f4"/>
    <circle cx="60" cy="120" r="5" fill="#edf2f4"/>
  </g>
</svg>
