<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f7f3ec"/>
  <ellipse cx="200" cy="330" rx="120" ry="20" fill="#e0d5c5"/>
  <!-- Box Base -->
  <polygon points="100,220 200,270 300,220 200,170" fill="#4d2912"/>
  <polygon points="100,220 200,270 200,310 100,260" fill="#361c0b"/>
  <polygon points="300,220 200,270 200,310 300,260" fill="#5e3318"/>
  <!-- Open Lid (Angled) -->
  <polygon points="100,160 200,210 300,160 200,110" fill="#6e3c1d"/>
  <!-- Carved Jali Lattice Lid Engraving -->
  <g stroke="#daa520" stroke-width="2" fill="none">
    <polygon points="140,160 200,190 260,160 200,130"/>
    <polygon points="170,160 200,175 230,160 200,145"/>
  </g>
</svg>
