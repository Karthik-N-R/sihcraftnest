  <circle cx="150" cy="200" r="18" fill="#b02a1e"/> <!-- Chilli -->
  <circle cx="250" cy="200" r="18" fill="#6b8e23"/> <!-- Cardamom -->
  <circle cx="150" cy="240" r="18" fill="#d2b48c"/> <!-- Cumin -->
  <circle cx="250" cy="240" r="18" fill="#8b4513"/> <!-- Clove/Cinnamon -->
  <circle cx="200" cy="180" r="16" fill="#f4a460"/> <!-- Mustard -->
  <circle cx="200" cy="260" r="16" fill="#e9967a"/> <!-- Pepper -->
