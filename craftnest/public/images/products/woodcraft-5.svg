<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f5f1ea"/>
  <ellipse cx="200" cy="330" rx="120" ry="20" fill="#ded5c4"/>
  <!-- Circular Wooden Masala Box Body -->
  <ellipse cx="200" cy="220" rx="130" ry="60" fill="#5c3417"/>
  <path d="M 70 220 L 70 260 C 70 300 330 300 330 260 L 330 220 Z" fill="#42240f"/>
  <ellipse cx="200" cy="220" rx="120" ry="52" fill="#2d180a"/>
  <!-- Inner 7 Spice Bowls -->
