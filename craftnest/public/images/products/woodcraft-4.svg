<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f7f4ee"/>
  <!-- Square Wooden Carved Panel -->
  <rect x="70" y="70" width="260" height="260" rx="10" fill="#7a431d" stroke="#542d12" stroke-width="8"/>
  <rect x="90" y="90" width="220" height="220" rx="6" fill="#542d12"/>
  <!-- Central Medallion Carving -->
  <circle cx="200" cy="200" r="75" fill="#8c5027"/>
  <circle cx="200" cy="200" r="50" fill="#542d12"/>
  <circle cx="200" cy="200" r="25" fill="#caa168"/>
  <!-- Corner Floral Scroll Carvings -->
  <circle cx="125" cy="125" r="18" fill="#8c5027"/>
  <circle cx="275" cy="125" r="18" fill="#8c5027"/>
  <circle cx="125" cy="275" r="18" fill="#8c5027"/>
  <circle cx="275" cy="275" r="18" fill="#8c5027"/>
</svg>
