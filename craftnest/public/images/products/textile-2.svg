<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8f4f1"/>
  <!-- Folded Dupatta Waves -->
  <path d="M 80 80 Q 200 130 320 80 L 340 320 Q 200 360 60 320 Z" fill="#b5179e"/>
  <path d="M 100 100 Q 200 145 300 100 L 315 305 Q 200 340 85 305 Z" fill="#0077b6"/>
  <!-- Pochampally Geometric Weave Pattern -->
  <g fill="#ffb703" opacity="0.85">
    <polygon points="160,160 180,140 200,160 180,180"/>
    <polygon points="220,160 240,140 260,160 240,180"/>
    <polygon points="190,210 210,190 230,210 210,230"/>
    <polygon points="160,260 180,240 200,260 180,280"/>
    <polygon points="220,260 240,240 260,260 240,280"/>
  </g>
  <!-- Fringe tassels at bottom -->
  <line x1="80" y1="320" x2="80" y2="350" stroke="#ffb703" stroke-width="4"/>
  <line x1="120" y1="328" x2="120" y2="358" stroke="#ffb703" stroke-width="4"/>
  <line x1="160" y1="335" x2="160" y2="365" stroke="#ffb703" stroke-width="4"/>
  <line x1="200" y1="340" x2="200" y2="370" stroke="#ffb703" stroke-width="4"/>
  <line x1="240" y1="335" x2="240" y2="365" stroke="#ffb703" stroke-width="4"/>
  <line x1="280" y1="328" x2="280" y2="358" stroke="#ffb703" stroke-width="4"/>
  <line x1="320" y1="320" x2="320" y2="350" stroke="#ffb703" stroke-width="4"/>
</svg>
